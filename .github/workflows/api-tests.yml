name: Pruebas de API

# Compila los microservicios, levanta el stack completo con Docker Compose y
# corre las pruebas de tests/api contra el gateway.

on:
  push:
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar los servicios y correr las pruebas unitarias
        working-directory: microservices
        run: mvn -B -ntp verify

      # El .env se genera aquí con valores de un solo uso: el repositorio no
      # guarda secretos. Correo y Cloudinary quedan con valores falsos, igual
      # que en un entorno local sin credenciales.
      - name: Generar microservices/.env
        working-directory: microservices
        run: |
          cat > .env <<EOF
          DB_USER=cine
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48)
          JWT_EXPIRATION=3600000
          GATEWAY_SECRET=$(openssl rand -hex 32)
          INTERNAL_TOKEN=$(openssl rand -hex 32)
          FRONTEND_URL=http://localhost:4200
          MAIL_USERNAME=ci@example.com
          MAIL_PASSWORD=sin-correo-en-ci
          CLOUDINARY_CLOUD_NAME=ci
          CLOUDINARY_API_KEY=000000000000000
          CLOUDINARY_API_SECRET=sin-cloudinary-en-ci
          TEST_USER_EMAIL=cliente.ci@example.com
          TEST_USER_PASSWORD=Ci-$(openssl rand -hex 12)
          EOF

      - name: Construir las imágenes
        working-directory: microservices
        run: docker compose build

      - name: Levantar el stack
        working-directory: microservices
        run: docker compose up -d

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/api/requirements.txt

      - name: Instalar las dependencias de las pruebas
        run: pip install -r tests/api/requirements.txt

      - name: Esperar a que el stack esté listo
        run: python tests/api/wait_for_stack.py --timeout 900

      - name: Correr las pruebas de API
        run: pytest tests/api -v -rx

      - name: Diagnóstico si algo falló
        if: failure()
        working-directory: microservices
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Apagar el stack
        if: always()
        working-directory: microservices
        run: docker compose down -v
