services:

  # ============================
  # BASES DE DATOS
  # ============================

  mysql-sucursales:
    image: mysql:8
    container_name: mysql-sucursales
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: sucursales_db
    volumes:
      - mysqldata-sucursales:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  mysql-confiteria:
    image: mysql:8
    container_name: mysql-confiteria
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: confiteria_db
    volumes:
      - mysqldata-confiteria:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-cartelera:
    image: mongo:7
    container_name: mongodb-cartelera
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongodata-cartelera:/data/db
      - ./init-scripts/mongodb-cartelera:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres-usuarios:
    image: postgres:16
    container_name: postgres-usuarios
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usuarios_db
    volumes:
      - pgdata-usuarios:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-facturacion:
    image: postgres:16
    container_name: postgres-facturacion
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sales_db
    volumes:
      - pgdata-facturacion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================
  # MIGRACIONES DE ESQUEMA (Flyway)
  # ============================
  # Contenedores de un solo uso: aplican las migraciones de cada servicio
  # (<servicio>/src/main/resources/db/migration) y terminan. Los servicios Java
  # esperan a que terminen bien y, al arrancar, comprueban esas mismas migraciones.
  #
  # Para preparar solo las bases, sin los servicios Java:
  #   docker compose up -d flyway-usuarios flyway-facturacion flyway-sucursales flyway-confiteria mongodb-cartelera
  # La versión coincide con la de Flyway que trae Spring Boot.

  flyway-usuarios:
    image: flyway/flyway:10.20.1
    container_name: flyway-usuarios
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./usuarios-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  flyway-facturacion:
    image: flyway/flyway:10.20.1
    container_name: flyway-facturacion
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres-facturacion:5432/sales_db
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./facturacion-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres-facturacion:
        condition: service_healthy

  flyway-sucursales:
    image: flyway/flyway:10.20.1
    container_name: flyway-sucursales
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql-sucursales:3306/sucursales_db?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./sucursales-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      mysql-sucursales:
        condition: service_healthy

  flyway-confiteria:
    image: flyway/flyway:10.20.1
    container_name: flyway-confiteria
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql-confiteria:3306/confiteria_db?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./confiteria-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      mysql-confiteria:
        condition: service_healthy

  # ============================
  # INFRAESTRUCTURA
  # ============================
  # Solo el gateway publica su puerto. Los demás servicios se alcanzan por la
  # red interna de Docker (por ejemplo, con `docker compose exec`).

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: cinemax/config-server
    container_name: config-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/auth-service/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    image: cinemax/service-discovery
    container_name: service-discovery
    # Panel de Eureka, solo para depurar y solo desde esta máquina.
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: cinemax/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  # ============================
  # MICROSERVICIOS DE NEGOCIO
  # ============================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: cinemax/auth-service
    container_name: auth-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  sucursales-service:
    build:
      context: .
      dockerfile: sucursales-service/Dockerfile
    image: cinemax/sucursales-service
    container_name: sucursales-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      mysql-sucursales:
        condition: service_healthy
      flyway-sucursales:
        condition: service_completed_successfully
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  cartelera-service:
    build:
      context: .
      dockerfile: cartelera-service/Dockerfile
    image: cinemax/cartelera-service
    container_name: cartelera-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb-cartelera:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  confiteria-service:
    build:
      context: .
      dockerfile: confiteria-service/Dockerfile
    image: cinemax/confiteria-service
    container_name: confiteria-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql-confiteria:
        condition: service_healthy
      flyway-confiteria:
        condition: service_completed_successfully
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    image: cinemax/usuarios-service
    container_name: usuarios-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      postgres-usuarios:
        condition: service_healthy
      flyway-usuarios:
        condition: service_completed_successfully
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  facturacion-service:
    build:
      context: .
      dockerfile: facturacion-service/Dockerfile
    image: cinemax/facturacion-service
    container_name: facturacion-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - FRONTEND_URL=${FRONTEND_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres-facturacion:
        condition: service_healthy
      flyway-facturacion:
        condition: service_completed_successfully
      service-discovery:  
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

volumes:
  mysqldata-sucursales:
  mysqldata-confiteria:
  mongodata-cartelera:
  pgdata-usuarios:
  pgdata-facturacion: