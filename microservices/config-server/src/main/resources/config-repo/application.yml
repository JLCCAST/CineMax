spring:
  cloud:
    openfeign:
      client:
        config:
          # Toda llamada entre servicios tiene un límite: si el otro servicio no
          # contesta, se corta y se responde 503, en vez de dejar al cliente esperando.
          default:
            connect-timeout: 1000
            read-timeout: 4000
  jpa:
    hibernate:
      # El esquema lo crea Flyway (db/migration en cada servicio).
      # Hibernate solo comprueba que las entidades coincidan con él.
      ddl-auto: validate
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/

jwt:
  secret: ${JWT_SECRET:your-secret-key}
  expiration: ${JWT_EXPIRATION:3600000}

# Control de acceso entre servicios (ServiceAccessFilter, en common-library).
# Sin valor por defecto a propósito: un servicio sin estos secretos no arranca.
cinemax:
  security:
    gateway-secret: ${GATEWAY_SECRET:}
    internal-token: ${INTERNAL_TOKEN:}
