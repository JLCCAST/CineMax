<div class="container mt-5">
  <section id="Homepage-Principal" class="screen active">

    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-12">
        <div id="CarruselPrincipal" class="carousel slide shadow" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#CarruselPrincipal" data-bs-slide-to="0" class="active"></button>
            <button *ngFor="let m of destacadas(); let i = index" type="button"
                    data-bs-target="#CarruselPrincipal" [attr.data-bs-slide-to]="i + 1"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="Imagenes/Estreno/morado.jpeg" class="d-block w-100" alt="Nuevos Estrenos">
            </div>
            <!-- Una lámina por película en cartelera, con datos de la API. -->
            <div class="carousel-item" *ngFor="let m of destacadas()">
              <div class="slide-pelicula">
                <img [src]="m.posterUrl || posterGenerico" class="slide-poster" [alt]="m.titleMovie">
                <div class="slide-texto">
                  <span class="slide-etiqueta">{{ m.status === 'Estreno' ? 'Estreno' : 'En cartelera' }}</span>
                  <h2 class="fw-bold">{{ m.titleMovie }}</h2>
                  <p class="d-none d-md-block">{{ m.synopsis }}</p>
                  <a class="btn btn-filtrar-redondeado" [routerLink]="['/movie', m.idMovie]">Comprar entradas</a>
                </div>
              </div>
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#CarruselPrincipal" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#CarruselPrincipal" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="container mt-4">
  <div class="filtro shadow-sm">
    <div class="row g-0 align-items-center">

      <div class="col-md-3 border-end-custom p-3">
        <label class="label-filtro">Por película</label>
        <select class="form-select select-minimal" [(ngModel)]="filtroIdMovie">
          <option [ngValue]="null">Película</option>
          <option *ngFor="let m of movies" [ngValue]="m.idMovie">{{ m.titleMovie }}</option>
        </select>
      </div>

      <div class="col-md-3 border-end-custom p-3">
        <label class="label-filtro">Por sede</label>
        <select class="form-select select-minimal" [(ngModel)]="filtroIdVenue">
          <option [ngValue]="null">Elige tu sede</option>
          <option *ngFor="let s of sedes" [ngValue]="s.idVenue">{{ s.nameVenue }}</option>
        </select>
      </div>

      <div class="col-md-3 border-end-custom p-3">
        <label class="label-filtro">Ciudad</label>
        <select class="form-select select-minimal" disabled>
          <option>Lima</option>
        </select>
      </div>

      <div class="col-md-3 p-3 d-flex justify-content-center">
        <button class="btn btn-filtrar-redondeado" (click)="filtrar()">
          <i class="fa-solid fa-sliders me-2"></i> Filtrar
        </button>
      </div>

    </div>
  </div>
</div>
    <div class="container mt-5 px-4">
      <div class="mb-4 border-bottom-purple">
        <h2 class="fw-bold text-white d-inline-block border-bottom border-primary border-3 pb-2">EN CARTELERA</h2>
      </div>
      <!-- Las primeras cuatro películas en cartelera o en estreno, desde la API. -->
      <div class="row g-3" *ngIf="destacadas().length">

        <div class="col-md-4" *ngIf="destacadas()[0] as m">
          <ng-container *ngTemplateOutlet="posterMosaico; context: { $implicit: m }"></ng-container>
        </div>

        <div class="col-md-8">
          <div class="row g-3 mb-3">

            <div class="col-md-6" *ngFor="let m of destacadas().slice(1, 3)">
              <ng-container *ngTemplateOutlet="posterMosaico; context: { $implicit: m }"></ng-container>
            </div>

          </div>
          <div class="row g-3">

            <div class="col-md-6" *ngIf="destacadas()[3] as m">
              <ng-container *ngTemplateOutlet="posterMosaico; context: { $implicit: m }"></ng-container>
            </div>

            <div class="col-md-6">
              <div class="ver-mas-card h-100 d-flex align-items-center justify-content-center text-center p-4 shadow-purple">
                <a (click)="irAMovies()" class="text-white text-decoration-none" style="cursor:pointer">
                  <i class="fa-solid fa-circle-plus fs-1 mb-3"></i><br>
                  <span class="fw-bold fs-4">Ver más películas</span>
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>

      <p class="text-white-50" *ngIf="!loading && !destacadas().length">
        Pronto anunciaremos nuevas películas.
      </p>

      <ng-template #posterMosaico let-m>
        <div class="poster-container h-100 shadow-purple position-relative" style="cursor:pointer" [routerLink]="['/movie', m.idMovie]">
          <img [src]="m.posterUrl || posterGenerico" class="img-mosaico" [alt]="m.titleMovie">
          <div class="titulo-mosaico" *ngIf="!m.posterUrl">{{ m.titleMovie }}</div>
          <div class="badge-estreno" *ngIf="m.status === 'Estreno' || m.premiereWeek">Estreno</div>
          <span *ngIf="m.classification?.nameClassification as clasificacion"
                class="badge bg-danger text-white position-absolute top-0 end-0 m-2 fs-6 rounded-pill shadow-sm">{{ clasificacion }}</span>
        </div>
      </ng-template>
    </div>

    <div class="container mt-5 pb-5">
      <div class="mb-4 border-bottom-purple">
        <h2 class="fw-bold text-white d-inline-block border-bottom border-primary border-3 pb-2 text-uppercase">Promociones Exclusivas</h2>
      </div>
      <div id="CarruselPromos" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#CarruselPromos" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#CarruselPromos" data-bs-slide-to="1"></button>
        </div>
        <div class="carousel-inner rounded-4 shadow-purple">
          <div class="carousel-item active">
            <img src="Imagenes/Promos/promo50.jpeg" class="d-block w-100 img-promo" alt="Promo 50">
          </div>
          <div class="carousel-item">
            <img src="Imagenes/Promos/combo_to_go.png" class="d-block w-100 img-promo" alt="Promo Combo To Go">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#CarruselPromos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#CarruselPromos" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

  </section>
</div>
