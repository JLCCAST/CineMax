<ol class="pasos">
  @for (paso of pasos; track paso.id; let i = $index) {
    @let e = estado(paso.id);
    <li [class.activo]="e === 'activo'" [class.hecho]="e === 'hecho'" [attr.aria-current]="e === 'activo' ? 'step' : null">
      <span class="numero">
        @if (e === 'hecho') { <i class="fa-solid fa-check"></i> } @else { {{ i + 1 }} }
      </span>
      <span class="nombre">{{ paso.label }}</span>
    </li>
  }
</ol>
