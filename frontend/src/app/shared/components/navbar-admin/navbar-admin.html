<header class="barra">
  <button type="button" class="hamburguesa" (click)="abrirMenu.emit()" aria-label="Abrir el menú">
    <i class="fa-solid fa-bars"></i>
  </button>
  <span class="titulo">Panel de administración</span>

  <div class="usuario">
    <span class="rol">{{ formatearRol(rolActual) }}</span>
    <button type="button" class="avatar" (click)="toggleDropdown()" aria-label="Menú de mi cuenta"
            [attr.aria-expanded]="dropdownAbierto">{{ inicial }}</button>

    @if (dropdownAbierto) {
      <div class="cerrar-fuera" (click)="cerrarDropdown()"></div>
      <div class="menu-usuario">
        <div class="menu-cabecera">
          <strong>{{ nombreUsuario }}</strong>
          <small>{{ formatearRol(rolActual) }}</small>
        </div>
        <a routerLink="/perfil" [queryParams]="{ tab: 'datos' }" (click)="cerrarDropdown()"><i class="fa-solid fa-user"></i> Mis datos</a>
        <a routerLink="/perfil" [queryParams]="{ tab: 'seguridad' }" (click)="cerrarDropdown()"><i class="fa-solid fa-lock"></i> Contraseña</a>
        <button type="button" class="salir" (click)="cerrarSesion()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</button>
      </div>
    }
  </div>
</header>
