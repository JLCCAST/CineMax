<aside class="menu">
  <a routerLink="/admin/dashboard" class="marca" (click)="navego.emit()">
    <img src="/Imagenes/logo_CINEMAX.jpeg" alt="CINEMAX">
    <span>Administración</span>
  </a>

  <nav aria-label="Secciones del panel">
    @for (s of secciones; track s.ruta) {
      <a [routerLink]="s.ruta" routerLinkActive="activo" (click)="navego.emit()">
        <i [class]="s.icono"></i> {{ s.texto }}
      </a>
    }
  </nav>

  <div class="pie-menu">
    <a routerLink="/"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver el sitio</a>
    <button type="button" (click)="cerrarSesion()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</button>
  </div>
</aside>
